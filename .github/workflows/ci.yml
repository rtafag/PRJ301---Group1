name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Java tests
        run: mvn --batch-mode test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-node/package-lock.json
      - name: Install Node dependencies
        working-directory: portal-node
        run: npm ci
      - name: Run Node tests
        working-directory: portal-node
        run: npm test
      - name: Build Java sandbox image
        run: docker build -t aita-java-sandbox:8 -f docker/sandbox/Dockerfile docker/sandbox
      - name: Start submission portal
        working-directory: portal-node
        run: |
          npm start > portal.log 2>&1 &
          echo $! > portal.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat portal.log
          exit 1
      - name: Run portal smoke test
        working-directory: portal-node
        run: npm run smoke
      - name: Stop submission portal
        if: always()
        working-directory: portal-node
        run: |
          if [ -f portal.pid ]; then
            kill "$(cat portal.pid)" || true
          fi
